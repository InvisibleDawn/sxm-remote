name: Release

# Publie automatiquement une release quand VERSION change dans sxm-remote.py
on:
  push:
    branches: [main]
    paths: ["sxm-remote.py", "packaging/**", "sxm-remote.desktop", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version
        id: v
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' sxm-remote.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Release déjà publiée ?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ steps.v.outputs.version }}")
          echo "skip=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Construire le .rpm
        if: steps.exists.outputs.skip == 'false'
        run: |
          dnf install -y rpm-build
          sed -i "s/^Version:.*/Version:        ${{ steps.v.outputs.version }}/" packaging/sxm-remote.spec
          mkdir -p ~/rpmbuild/SOURCES
          cp sxm-remote.py sxm-remote.desktop ~/rpmbuild/SOURCES/
          rpmbuild -bb --undefine dist packaging/sxm-remote.spec
          cp ~/rpmbuild/RPMS/noarch/*.rpm .
      - name: Publier la release
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SXM Remote ${{ steps.v.outputs.version }}
          files: "*.noarch.rpm"
          generate_release_notes: true
