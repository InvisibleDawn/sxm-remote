name: Nettoyage ponctuel

# Efface l'historique des anciennes compilations (onglet Actions),
# qui affichait l'ancien nom d'auteur. S'exécute une seule fois.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nettoyage.yml']

permissions:
  actions: write
  contents: read

jobs:
  nettoyage:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les anciennes exécutions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" --jq '.workflow_runs[].id' |
          while read id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" && echo "supprimé $id" || true
          done
